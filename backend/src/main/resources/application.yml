spring:
  application:
    name: medflow-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medflow}
    username: ${DB_USER:medflow}
    password: ${DB_PASSWORD:medflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é controlado pelo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# Desenvolvimento local: carrega também os dados de exemplo (db/seed)
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

logging:
  level:
    br.ufal.medflow: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
