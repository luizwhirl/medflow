spring:
  application:
    name: medflow-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medflow}
    username: ${DB_USER:medflow}
    password: ${DB_PASSWORD:medflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é controlado pelo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  estoque:
    limite-reservado: 20 # com saldo até esta quantidade o item aparece como RESERVADO
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  bnafar:
    base-url: ${BNAFAR_BASE_URL:https://apidadosabertos.saude.gov.br}
    tamanho-pagina: 1000 # máximo aceito pela API
    max-paginas: 500
    timeout-conexao: 5s
    timeout-leitura: 30s
  sync:
    ativo: ${SYNC_ATIVO:false}
    municipios: ${SYNC_MUNICIPIOS:} # IBGE (6 ou 7 dígitos), separados por vírgula
    cron: ${SYNC_CRON:0 0 */6 * * *} # a cada 6 horas (fuso de Maceió)
    executar-ao-iniciar: ${SYNC_AO_INICIAR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# Desenvolvimento local: carrega também os dados de exemplo (db/seed)
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

logging:
  level:
    br.ufal.medflow: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
