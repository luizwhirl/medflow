# Infraestrutura de desenvolvimento local.
#   docker compose up -d                 -> só o PostgreSQL
#   docker compose --profile tools up -d -> PostgreSQL + pgAdmin
#   docker compose --profile full up -d --build -> PostgreSQL + API + Web (tudo em container, com os dados de exemplo)
name: medflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
      POSTGRES_USER: ${POSTGRES_USER:-medflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medflow} -d ${POSTGRES_DB:-medflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@medflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

  # Aplica migrations + seed sem subir a API (usado por scripts/db-reset).
  # Mantenha igual ao backend, senão o db-reset monta um banco diferente do que a API monta:
  # - imagem: a versão do flyway-core que o Spring Boot traz (backend/build.gradle.kts; confira com
  #   ./gradlew dependencies --configuration runtimeClasspath | grep flyway-core);
  # - FLYWAY_LOCATIONS e FLYWAY_OUT_OF_ORDER: o perfil dev do backend/src/main/resources/application.yml.
  flyway:
    image: flyway/flyway:12.4.0-alpine
    profiles: [migracao] # não sobe com o up; roda com docker compose run --rm flyway
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-medflow}
      FLYWAY_USER: ${POSTGRES_USER:-medflow}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-medflow}
      FLYWAY_LOCATIONS: filesystem:/flyway/db/migration,filesystem:/flyway/db/seed
      FLYWAY_OUT_OF_ORDER: "true"
    volumes:
      - ./backend/src/main/resources/db:/flyway/db:ro
    command: migrate
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    profiles: [full]
    environment:
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-medflow}
      - DB_USER=${POSTGRES_USER:-medflow}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-medflow}
      - CORS_ALLOWED_ORIGINS=http://localhost:${WEB_PORT:-4200}
      # dev por padrão: carrega os dados de exemplo e usa o segredo JWT de desenvolvimento.
      # Para outro ambiente, use SPRING_PROFILES_ACTIVE=prod (sem seed) e defina JWT_SECRET.
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # Sem valor: só chegam ao container se estiverem definidos no ambiente ou no .env
      # (um valor vazio no dev derrubaria o segredo padrão).
      - JWT_SECRET
      - JWT_EXPIRACAO
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    profiles: [full]
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  pgdata:
